<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم - المستودع</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="checkAccess()">
    <div class="nav-bar">
        <button onclick="location.href='admin_requests.html'" class="reports-btn">📊 التقارير والطلبات</button>
        <button onclick="logout()" class="exit-btn">❌ خروج</button>
    </div>

    <div class="container">
        <h2>🔍 البحث السريع</h2>
        <input type="text" id="searchInput" onkeyup="quickSearch()" placeholder="ابحث عن صنف (كيمياويات، أجهزة...)...">
        <div id="searchResults" class="results-grid"></div>

        <hr>
        <h2>📦 أقسام المستودع</h2>
        <div class="categories-grid">
            <button onclick="showCategory('chemicals')" class="cat-btn green">🧪 قسم الكيمياويات</button>
            <button onclick="showCategory('consumables')" class="cat-btn blue">📦 قسم المستهلكات</button>
            <button onclick="showCategory('devices')" class="cat-btn purple">💻 قسم الأجهزة</button>
        </div>
        
        <button onclick="location.href='add-item.html'" class="add-main-btn">➕ إضافة صنف جديد للمخزن</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
