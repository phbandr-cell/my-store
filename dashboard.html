<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; }
        .nav-bar { background: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 900px; margin: 20px auto; padding: 20px; background: white; border-radius: 10px; }
        .cat-btn { width: 100%; padding: 25px; margin: 10px 0; border: none; border-radius: 8px; color: white; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .chemicals { background: #27ae60; } .consumables { background: #2980b9; } .devices { background: #8e44ad; }
        .cat-btn:hover { opacity: 0.8; transform: scale(1.02); }
        .search-box { width: 100%; padding: 15px; margin-bottom: 20px; border: 2px solid #3498db; border-radius: 8px; font-size: 18px; }
        .item-card { border: 1px solid #eee; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; background: #fafafa; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body onload="checkAccess()">
    <div class="nav-bar">
        <span>مرحباً بك في نظام المستودع</span>
        <button onclick="logout()" class="logout-btn">خروج ❌</button>
    </div>

    <div class="container">
        <h2>🔍 البحث عن صنف</h2>
        <input type="text" id="searchInput" class="search-box" onkeyup="quickSearch()" placeholder="اكتب اسم الصنف للبحث...">
        <div id="searchResults"></div>

        <hr>
        <h2>📦 أقسام المستودع</h2>
        <button onclick="showCategory('chemicals')" class="cat-btn chemicals">🧪 قسم الكيمياويات</button>
        <button onclick="showCategory('consumables')" class="cat-btn consumables">📦 قسم المستهلكات</button>
        <button onclick="showCategory('devices')" class="cat-btn devices">💻 قسم الأجهزة</button>
        
        <button onclick="location.href='add-item.html'" style="width:100%; padding:15px; background:#f39c12; color:white; border:none; border-radius:8px; margin-top:20px; cursor:pointer; font-weight:bold;">➕ إضافة صنف جديد للمستودع</button>
    </div>

    <script src="script.js"></script>
    <script>
        function checkAccess() { if (!localStorage.getItem('currentUser')) window.location.href = "index.html"; }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
