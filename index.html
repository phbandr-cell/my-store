<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودعي - تسجيل الدخول</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">📦 برنامج مستودعي</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن صنف (كيمياويات، أجهزة...)" oninput="quickSearch()">
            <div id="searchResults"></div>
        </div>

        <hr>

        <div id="loginSection">
            <h3>تسجيل الدخول</h3>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <select id="userRole">
                <option value="staff">مسؤول (صلاحيات محددة)</option>
                <option value="admin">أدمن (صلاحيات كاملة)</option>
            </select>
            <button onclick="login()">دخول للنظام</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
