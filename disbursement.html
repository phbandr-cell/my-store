<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب صرف صنف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="setupDisbursement()">
    <div class="container">
        <h2>📋 طلب صرف صنف</h2>
        <p>الصنف: <span id="targetItem" style="font-weight:bold;"></span></p>
        <p>المخزون المتوفر: <span id="currentStock"></span></p>
        <hr>
        <input type="text" id="requesterName" placeholder="اسم المستلم">
        <input type="number" id="requestQty" placeholder="الكمية المطلوبة">
        <button onclick="sendRequest()" class="save-btn" style="background:#2980b9;">📤 إرسال الطلب للمسؤول</button>
        <button onclick="location.href='dashboard.html'" class="back-btn">رجوع</button>
    </div>
    <script src="script.js"></script>
    <script>
        function setupDisbursement() {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('targetItem').innerText = params.get('item') || "غير محدد";
            document.getElementById('currentStock').innerText = params.get('stock') || "0";
        }
    </script>
</body>
</html>
