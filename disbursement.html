<button onclick="sendRequest()">إرسال الطلب للمسؤول</button>

<script src="script.js"></script>
<script>
    async function sendRequest() {
        const itemName = new URLSearchParams(window.location.search).get('item');
        const requester = document.getElementById('requesterName').value;
        const qty = document.getElementById('requestQty').value;
        if(!requester || !qty) { alert("أكمل البيانات"); return; }

        const res = await fetch(`requests.json?t=${new Date().getTime()}`);
        let requests = await res.json();
        requests.push({ id: Date.now(), itemName, requester, quantity: qty, status: "pending", date: new Date().toLocaleString() });
        
        if (await saveToGitHub('requests.json', requests)) {
            alert("تم الإرسال ✅");
            location.href = "index.html";
        }
    }
</script>
