<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>طلب صرف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" style="max-width:500px; margin:auto; padding:20px;">
        <h2>📝 نموذج طلب صرف</h2>
        <p>الصنف: <span id="targetItem">...</span></p>
        <p>المخزون: <span id="availableStock">0</span></p>
        <hr>
        <label>الاسم:</label>
        <input type="text" id="requesterName" style="width:100%; padding:10px; margin:10px 0;">
        <label>الكمية:</label>
        <input type="number" id="requestQty" style="width:100%; padding:10px; margin:10px 0;">
        
        <button id="submitBtn" onclick="sendRequest()" style="background:#3498db; color:white; width:100%; padding:15px; border:none; border-radius:5px; cursor:pointer;">
            📤 إرسال الطلب للمسؤول
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            document.getElementById('targetItem').innerText = decodeURIComponent(params.get('item') || "");
            document.getElementById('availableStock').innerText = params.get('stock') || "0";
        }
    </script>
</body>
</html>
