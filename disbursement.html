<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلب صرف - مستودعي</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>نموذج طلب صرف صنف</h2>
        
        <div id="itemDetails" style="background: #ecf0f1; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
            <p><strong>الصنف:</strong> <span id="targetItem">جاري التحميل...</span></p>
            <p><strong>الرصيد المتوفر:</strong> <span id="availableQty">0</span></p>
        </div>

        <hr>

        <div class="form-group">
            <label>اسم طالب الصرف:</label>
            <input type="text" id="requesterName" placeholder="الاسم الرباعي">
            
            <label>القسم الطالب:</label>
            <input type="text" id="requesterDept" placeholder="مثلاً: قسم الأحياء">
            
            <label>المعمل:</label>
            <input type="text" id="labNumber" placeholder="رقم أو اسم المعمل">
            
            <label>الكمية المطلوبة:</label>
            <input type="number" id="requestQty" placeholder="أدخل الكمية">
        </div>

        <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button onclick="processDisbursement('approved')" style="background: #27ae60;">✅ موافقة وصرف</button>
            <button onclick="processDisbursement('rejected')" style="background: #c0392b;">❌ رفض الطلب</button>
        </div>
        
        <button onclick="location.href='index.html'" style="background: #7f8c8d; margin-top: 10px;">رجوع للبحث</button>
    </div>

    <script src="script.js"></script>
    <script>
        // كود تشغيل الصفحة لعمل محاكاة بسيطة حالياً
        window.onload = function() {
            // محاكاة جلب بيانات الصنف من الرابط
            const urlParams = new URLSearchParams(window.location.search);
            const itemName = urlParams.get('item') || "صنف تجريبي";
            document.getElementById('targetItem').innerText = itemName;
            document.getElementById('availableQty').innerText = "50"; // قيمة افتراضية للآن
        };
    </script>
</body>
</html>
