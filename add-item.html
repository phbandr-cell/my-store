<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة صنف جديد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadUnits()">
    <div class="container">
        <h2>➕ إضافة صنف جديد للمستودع</h2>
        <div class="form-group">
            <select id="category">
                <option value="">...اختر القسم</option>
                <option value="chemicals">الكيمياويات</option>
                <option value="consumables">المستهلكات</option>
                <option value="devices">الأجهزة</option>
            </select>
            
            <input type="text" id="itemName" placeholder="اسم الصنف">
            <input type="number" id="itemQty" placeholder="الكمية">
            
            <select id="unit">
                </select>
            
            <button onclick="addItem()" class="save-btn">💾 حفظ الصنف في المخزن</button>
            <button onclick="location.href='dashboard.html'" class="back-btn">🔙 إلغاء ورجوع</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
