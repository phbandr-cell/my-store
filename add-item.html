<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة صنف</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .save-btn { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body onload="loadUnits()">
    <div class="container">
        <h2>➕ إضافة صنف جديد</h2>
        <select id="category">
            <option value="chemicals">قسم الكيمياويات</option>
            <option value="consumables">قسم المستهلكات</option>
            <option value="devices">قسم الأجهزة</option>
        </select>
        <input type="text" id="itemName" placeholder="اسم الصنف">
        <input type="number" id="itemQty" placeholder="الكمية">
        <select id="unit">
            </select>
        <button onclick="addItem()" class="save-btn">💾 حفظ في المستودع</button>
        <button onclick="location.href='dashboard.html'" style="background:#95a5a6; color:white; border:none;">🔙 رجوع</button>
    </div>

    <script src="script.js"></script>
    <script>
        function loadUnits() {
            const unitSelect = document.getElementById('unit');
            const units = ["مل", "لتر", "جرام", "كجم", "علبة", "جهاز", "قطعة"];
            unitSelect.innerHTML = units.map(u => `<option value="${u}">${u}</option>`).join('');
        }
    </script>
</body>
</html>
