<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة صنف</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loadUnits()">
    <div class="container">
        <h2>➕ إضافة صنف جديد</h2>
        <select id="category">
            <option value="chemicals">الكيمياويات</option>
            <option value="consumables">المستهلكات</option>
            <option value="devices">الأجهزة</option>
        </select>
        <input type="text" id="itemName" placeholder="اسم الصنف">
        <input type="number" id="itemQty" placeholder="الكمية">
        <select id="unit">
            </select>
        <button onclick="addItem()" class="save-btn">حفظ الصنف</button>
        <button onclick="location.href='dashboard.html'">رجوع</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
