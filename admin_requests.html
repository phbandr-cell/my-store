<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة الطلبات والخصم</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background: #2c3e50; color: white; }
        .approve-btn { background: #27ae60; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body onload="loadRequests()">
    <h2>📊 طلبات بانتظار التأكيد والخصم</h2>
    <table>
        <thead>
            <tr>
                <th>الصنف</th>
                <th>المستلم</th>
                <th>الكمية</th>
                <th>التاريخ</th>
                <th>الإجراء</th>
            </tr>
        </thead>
        <tbody id="reqTable"></tbody>
    </table>
    <button onclick="location.href='dashboard.html'" style="margin-top:20px;">العودة للوحة التحكم</button>

    <script src="script.js"></script>
    <script>
        async function loadRequests() {
            const res = await fetch(`requests.json?t=${Date.now()}`);
            const data = await res.json();
            document.getElementById('reqTable').innerHTML = data.map((r, index) => `
                <tr>
                    <td>${r.item}</td>
                    <td>${r.requester}</td>
                    <td>${r.qty}</td>
                    <td>${r.date}</td>
                    <td>
                        ${r.status === "قيد الانتظار" ? 
                        `<button class="approve-btn" onclick="approveAndDeduct('${r.item}', ${r.qty}, ${index}, '${r.category}')">تأكيد وخصم</button>` : 'تم الخصم'}
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
