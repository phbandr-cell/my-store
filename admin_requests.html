<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم المسؤول - الطلبات</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .request-item { background: #fff; border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.9em; }
        .status-pending { background: #fff3cd; color: #856404; }
        .btn-approve { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-reject { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body onload="checkAccess(); loadAdminRequests();">
    <div class="container">
        <h2>📂 إدارة طلبات الصرف</h2>
        <div id="adminRequestsList">جاري تحميل الطلبات...</div>
        <button onclick="location.href='dashboard.html'" style="margin-top:20px;">العودة للوحة التحكم</button>
    </div>

    <script src="script.js"></script>
    <script>
        async function loadAdminRequests() {
            const listDiv = document.getElementById('adminRequestsList');
            try {
                const res = await fetch(`requests.json?t=${new Date().getTime()}`);
                const data = await res.json();
                const pending = data.filter(r => r.status === 'pending');

                if (pending.length === 0) {
                    listDiv.innerHTML = "<p>لا توجد طلبات معلقة حالياً.</p>";
                    return;
                }

                listDiv.innerHTML = "";
                pending.forEach(req => {
                    listDiv.innerHTML += `
                        <div class="request-item">
                            <div>
                                <strong>${req.itemName}</strong><br>
                                <small>الطالب: ${req.requester} | الكمية: ${req.quantity}</small><br>
                                <small>التاريخ: ${req.date}</small>
                            </div>
                            <div>
                                <button class="btn-approve" onclick="handleAction(${req.id}, 'approved')">موافقة</button>
                                <button class="btn-reject" onclick="handleAction(${req.id}, 'rejected')">رفض</button>
                            </div>
                        </div>`;
                });
            } catch (e) { listDiv.innerHTML = "فشل في تحميل الطلبات."; }
        }

        async function handleAction(id, newStatus) {
            if(!confirm("تأكيد الإجراء؟")) return;
            const res = await fetch(`requests.json?t=${new Date().getTime()}`);
            let data = await res.json();
            const idx = data.findIndex(r => r.id === id);
            if (idx !== -1) {
                data[idx].status = newStatus;
                if (await saveToGitHub('requests.json', data)) {
                    alert("تم تحديث حالة الطلب!");
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
